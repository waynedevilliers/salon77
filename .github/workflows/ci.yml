name: CI

# Runs once per change: on pull requests, and on pushes to main.
# A branch with an open pull request does not run twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run type-check
      - run: npm run format:check
      # Unused files, exports and dependencies.
      - run: npm run knip

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage -- --run

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run audit
      # Packages that ship with the site: no known advisory at any level.
      - run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'pull_request'
      - run: npx playwright install --with-deps
        if: github.event_name == 'push'
      # Pull requests: Chromium and one mobile profile. Builds the site first.
      - run: npx playwright test --project=chromium --project=mobile-chrome
        if: github.event_name == 'pull_request'
      # main: every browser profile.
      - run: npm run e2e
        if: github.event_name == 'push'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    # Only on main: slow, and the performance budgets do not change per pull request.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Lighthouse CI is run from npx rather than listed in package.json.
      # Its dependency tree currently has high-severity advisories with no
      # fix, which would fail the audit job. It runs only here, against our
      # own build, and does not ship with the site.
      - run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
