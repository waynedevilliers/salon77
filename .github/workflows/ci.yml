name: CI

# Runs once per change: on pull requests, and on pushes to main.
# A branch with an open pull request does not run twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- run

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run audit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'pull_request'
      - run: npx playwright install --with-deps
        if: github.event_name == 'push'
      # Pull requests: Chromium and one mobile profile. Builds the site first.
      - run: npx playwright test --project=chromium --project=mobile-chrome
        if: github.event_name == 'pull_request'
      # main: every browser profile.
      - run: npm run e2e
        if: github.event_name == 'push'

  lighthouse:
    # Only on main: slow, and the performance budgets do not change per pull request.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Lighthouse CI is run from npx rather than listed in package.json.
      # Its dependency tree currently has high-severity advisories with no
      # fix, which would fail the audit job. It runs only here, against our
      # own build, and does not ship with the site.
      - run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
